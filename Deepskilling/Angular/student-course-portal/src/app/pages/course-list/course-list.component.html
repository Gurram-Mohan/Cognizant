<!-- Hands-On 3: CourseListComponent Template -->
<!-- Demonstrates *ngIf, *ngFor, and async pipe -->

<div class="page-hero">
  <div class="container">
    <h1>Course Catalog</h1>
    <p>Browse and enroll in available courses for the upcoming semester.</p>
  </div>
</div>

<div class="page-content">
  <!-- Controls Section: Search and Filters -->
  <div class="controls-section animate-fade-in-up stagger-1">
    <div class="search-filter-bar">
      <!-- Search -->
      <div class="search-box">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="18" height="18" class="search-icon">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 15.803a7.5 7.5 0 0010.607 10.607z"/>
        </svg>
        <input type="text" [(ngModel)]="searchQuery" placeholder="Search by name, code, or instructor..." class="form-control">
      </div>

      <!-- Filters -->
      <div class="filter-group">
        <select [(ngModel)]="selectedCategory" class="form-control filter-select">
          <option *ngFor="let cat of categories" [value]="cat">{{ cat === 'All' ? 'All Categories' : cat }}</option>
        </select>
        
        <select [(ngModel)]="selectedStatus" class="form-control filter-select">
          <option *ngFor="let status of statuses" [value]="status">{{ status === 'All' ? 'All Statuses' : (status | uppercase) }}</option>
        </select>
      </div>

      <!-- View Toggle -->
      <div class="view-toggle">
        <button class="toggle-btn" [class.active]="viewMode === 'grid'" (click)="toggleView()" aria-label="Grid View">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
          </svg>
        </button>
        <button class="toggle-btn" [class.active]="viewMode === 'list'" (click)="toggleView()" aria-label="List View">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" width="20" height="20">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Hands-On 9: Error handling with async pipe -->
  <div class="alert alert-danger mt-lg" *ngIf="error$ | async as error">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" width="20" height="20">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
    </svg>
    {{ error }}
  </div>

  <!-- Main Content Area -->
  <div class="mt-lg">
    <!-- Hands-On 3: *ngIf loading spinner -->
    <!-- Hands-On 9: Also checks global loading state from NgRx -->
    <div class="loading-state flex-center flex-col gap-md" *ngIf="isLoading || (loading$ | async)">
      <div class="spinner"></div>
      <p>Loading courses...</p>
    </div>

    <!-- Course Grid/List -->
    <!-- Hands-On 9: Render courses from NgRx store using async pipe -->
    <ng-container *ngIf="!(isLoading || (loading$ | async)) && (courses$ | async) as courses">
      <!-- Empty State -->
      <div class="empty-state" *ngIf="filterCourses(courses).length === 0">
        <div class="empty-icon">🔍</div>
        <h3>No courses found</h3>
        <p>Try adjusting your search query or filters.</p>
        <button class="btn btn-outline mt-sm" (click)="searchQuery = ''; selectedCategory = 'All'; selectedStatus = 'All'">Clear Filters</button>
      </div>

      <!-- Results Info -->
      <div class="results-info mb-md" *ngIf="filterCourses(courses).length > 0">
        Showing {{ filterCourses(courses).length }} course(s)
      </div>

      <!-- The Grid -->
      <div [ngClass]="viewMode === 'grid' ? 'grid-auto' : 'list-view'" class="animate-fade-in-up stagger-2" *ngIf="filterCourses(courses).length > 0">
        <!-- Hands-On 3: *ngFor over courses array -->
        <!-- Hands-On 2: Child component with @Input and @Output -->
        <app-course-card
          *ngFor="let course of filterCourses(courses); trackBy: trackByCourseId"
          [course]="course"
          (enrollRequested)="onEnroll($event)">
        </app-course-card>
      </div>
    </ng-container>
  </div>
</div>
